global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: phone
    static_configs:
      - targets: ['127.0.0.1:9200']

  # Ping the phone itself (LAN/Wi-Fi hop). Target IP is written by the
  # phone exporter, because Android picks a new hotspot subnet on restart.
  - job_name: ping-gateway
    metrics_path: /probe
    params: {module: [icmp]}
    file_sd_configs:
      - files: ['/etc/prometheus/sd/gateway.json']
    relabel_configs: &blackbox
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9116

  # Ping well-known anycast hosts through the 5G link.
  - job_name: ping-internet
    metrics_path: /probe
    params: {module: [icmp]}
    static_configs:
      - targets: ['1.1.1.1', '8.8.8.8', '9.9.9.9']
    relabel_configs: *blackbox

  - job_name: dns
    scrape_interval: 60s
    metrics_path: /probe
    params: {module: [dns]}
    static_configs:
      - targets: ['1.1.1.1', '8.8.8.8']
    relabel_configs: *blackbox

  - job_name: http
    scrape_interval: 60s
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      - targets: ['https://www.google.com/generate_204', 'https://www.cloudflare.com/cdn-cgi/trace']
    relabel_configs: *blackbox

  # Only answers when started with `--profile speedtest`.
  - job_name: speedtest
    scrape_interval: 6h
    scrape_timeout: 2m
    static_configs:
      - targets: ['127.0.0.1:9798']
